services:
  desafio-cartoes:
    build:
      context: .
      dockerfile: Dockerfile
    image: desafio-cartoes:latest
    container_name: desafio-cartoes
    ports:
      - "8080:8080"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
